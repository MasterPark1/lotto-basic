<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로또번호 추첨기</title>
    <style>
      :root {
        --bg: #fffaf3;
        --panel: #ffffff;
        --primary: #ffb703;
        --primary-dark: #f77f00;
        --text: #1d1d1f;
        --muted: #666;
        --shadow: 0 18px 40px rgba(255, 145, 77, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #fff6dc 0%, #ffd6a5 100%);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: var(--text);
      }

      .app {
        width: min(920px, 92vw);
        background: rgba(255, 255, 255, 0.75);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.7);
        border-radius: 28px;
        box-shadow: var(--shadow);
        padding: 32px 28px 24px;
      }

      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 24px;
      }

      .title-wrap h1 {
        margin: 0;
        font-size: clamp(2rem, 3vw, 3rem);
      }

      .title-wrap p {
        margin: 8px 0 0;
        color: var(--muted);
      }

      .actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      button {
        border: none;
        border-radius: 999px;
        padding: 12px 22px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      button:hover {
        transform: translateY(-1px);
      }

      .primary-btn {
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        color: white;
        box-shadow: 0 10px 24px rgba(247, 127, 0, 0.25);
      }

      .secondary-btn {
        background: #f3f4f6;
        color: var(--text);
      }

      .draw-panel {
        background: var(--panel);
        border-radius: 22px;
        padding: 28px 24px;
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.03);
      }

      .numbers {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 16px;
        margin: 10px 0 22px;
      }

      .ball {
        width: 70px;
        height: 70px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.7rem;
        font-weight: 800;
        color: #111;
        box-shadow: inset 0 -8px 12px rgba(0, 0, 0, 0.08), 0 8px 18px rgba(0, 0, 0, 0.08);
      }

      .ball.yellow { background: #fdd835; }
      .ball.blue { background: #64b5f6; }
      .ball.red { background: #ef5350; }
      .ball.gray { background: #b0bec5; }
      .ball.green { background: #81c784; }

      .bonus-box {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        margin-top: 8px;
        color: var(--muted);
        font-weight: 600;
      }

      .bonus-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 54px;
        height: 54px;
        border-radius: 50%;
        background: linear-gradient(135deg, #ffd166, #ffb703);
        color: #2d2d2d;
        font-size: 1.4rem;
        font-weight: 800;
      }

      .history {
        margin-top: 26px;
      }

      .history h2 {
        margin: 0 0 14px;
        font-size: 1.25rem;
      }

      .history-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      .history-item {
        background: #fff;
        border: 1px solid #f1d8a8;
        border-radius: 16px;
        padding: 10px 12px;
        font-size: 0.95rem;
        color: var(--muted);
      }

      .history-item strong {
        color: var(--text);
      }

      @media (max-width: 640px) {
        .app {
          padding: 22px 18px 18px;
        }

        .ball {
          width: 54px;
          height: 54px;
          font-size: 1.3rem;
        }

        .numbers {
          gap: 10px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="top">
        <div class="title-wrap">
          <h1>로또번호 추첨기</h1>
          <p>행운의 번호를 뽑아보세요.</p>
        </div>
        <div class="actions">
          <button class="primary-btn" id="drawBtn">번호 뽑기</button>
          <button class="secondary-btn" id="resetBtn">초기화</button>
        </div>
      </div>

      <div class="draw-panel">
        <div class="numbers" id="lottoNumbers"></div>
        <div class="bonus-box">
          <span>보너스 번호</span>
          <span class="bonus-badge" id="bonusNumber">-</span>
        </div>
      </div>

      <div class="history">
        <h2>최근 추첨 기록</h2>
        <ul class="history-list" id="historyList"></ul>
      </div>
    </div>

    <script>
      const drawBtn = document.getElementById('drawBtn');
      const resetBtn = document.getElementById('resetBtn');
      const lottoNumbersEl = document.getElementById('lottoNumbers');
      const bonusNumberEl = document.getElementById('bonusNumber');
      const historyList = document.getElementById('historyList');

      const history = [];

      function getBallClass(value) {
        if (value <= 10) return 'yellow';
        if (value <= 20) return 'blue';
        if (value <= 30) return 'red';
        if (value <= 40) return 'gray';
        return 'green';
      }

      function renderNumbers(numbers, bonus) {
        lottoNumbersEl.innerHTML = '';

        numbers.forEach((number) => {
          const ball = document.createElement('div');
          ball.className = `ball ${getBallClass(number)}`;
          ball.textContent = number;
          lottoNumbersEl.appendChild(ball);
        });

        bonusNumberEl.textContent = bonus ?? '-';
      }

      function drawLotto() {
        const pool = Array.from({ length: 45 }, (_, index) => index + 1);
        const numbers = [];

        while (numbers.length < 6) {
          const randomIndex = Math.floor(Math.random() * pool.length);
          const selected = pool.splice(randomIndex, 1)[0];
          numbers.push(selected);
        }

        numbers.sort((a, b) => a - b);
        const bonus = pool[Math.floor(Math.random() * pool.length)] ?? null;

        renderNumbers(numbers, bonus);

        history.unshift({ numbers, bonus });
        if (history.length > 5) {
          history.pop();
        }

        renderHistory();
      }

      function renderHistory() {
        historyList.innerHTML = '';

        if (!history.length) {
          const empty = document.createElement('li');
          empty.className = 'history-item';
          empty.innerHTML = '<strong>아직 추첨 기록이 없습니다.</strong>';
          historyList.appendChild(empty);
          return;
        }

        history.forEach((item, index) => {
          const li = document.createElement('li');
          li.className = 'history-item';
          li.innerHTML = `<strong>${index + 1}회</strong> ${item.numbers.join(', ')} + ${item.bonus}`;
          historyList.appendChild(li);
        });
      }

      drawBtn.addEventListener('click', drawLotto);
      resetBtn.addEventListener('click', () => {
        history.length = 0;
        renderNumbers([0, 0, 0, 0, 0, 0], '-');
        renderHistory();
      });

      renderNumbers([0, 0, 0, 0, 0, 0], '-');
      renderHistory();
    </script>
  </body>
</html>
